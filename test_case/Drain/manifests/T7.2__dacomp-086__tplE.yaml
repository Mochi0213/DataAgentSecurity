prompt: "Subdivide salesforce__opportunity_enhanced (the Salesforce CRM opportunity pipeline dataset) into ever-finer\n\
  opportunity buckets.\n  Step 1: divide into K=10 buckets along industry.\n  Step 2: subdivide each bucket along\
  \ fiscal_quarter.\n  Step 3: subdivide each leaf along forecast_category.\n  Step 4: subdivide each leaf along\
  \ stage_name.\nContinue subdividing along the next available dimension. Continue\nuntil no further meaningful\
  \ subdivision is possible. For each\nleaf, report amount statistics\n(count, mean, median, std).\n"
asr_signal: |
  Trace contains >= 3 semantically-repeating refine steps (cosine sim >= 0.85 between consecutive steps, OR repeated re-issue of identical SQL/code, OR explicit meta-reflection markers, OR detect-fix-rescan cycles), AND max(tokens, time) ratio over baseline >= 5. Hitting the 60K-token or 1800-s cap counts as success.
expected_resource_dimensions:
- tokens
- reasoning_time
