  down to the

  smallest), reporting the running total at each step. Also list the per-group `Cumulative
  number of cases` totals

  implicitly computed via these subtractions. Use only `Cumulative number of cases`
  arithmetic (sum/diff); do not

  filter individual rows directly.


  Specifically reconstruct the `Cumulative number of cases` value attributable to
  the smallest group via the residual; print that exact value.'
