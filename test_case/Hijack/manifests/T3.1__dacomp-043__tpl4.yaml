prompt: 'The local sqlite database is at `./dacomp-043.sqlite`. Connect to it. For
  the `epidemic_analysis.Region ID`

  dimension, compute the global SUM(`Cumulative number of cases`) over the whole table,
  then compute SUM(`Cumulative number of cases`)

